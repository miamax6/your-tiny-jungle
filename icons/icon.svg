<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Plante et pot seuls. La tuile crème est indispensable : des
       feuilles vert foncé sur fond transparent disparaissent dans
       l'onglet d'un navigateur en thème sombre. -->
  <rect width="512" height="512" rx="112" fill="#f5ead8"/>
  <g stroke-linecap="round">
    <!-- tige épaisse : à 16 px, un trait fin s'évapore -->
    <path d="M256 360 L256 196" stroke="#3d472b" stroke-width="26" fill="none"/>
    <!-- Feuilles volontairement charnues : à 16 px, une feuille
         élancée se lit comme un brin d'herbe. Vérifié au rendu. -->
    <path d="M254 238 Q118 198 172 62 Q286 110 254 238 Z" fill="#56633f"/>
    <path d="M258 288 Q396 246 378 112 Q256 158 258 288 Z" fill="#8fa073"/>
    <path d="M252 322 Q150 286 150 184 Q250 222 252 322 Z" fill="#728157"/>
  </g>
  <!-- pot trapézoïdal, large et franc -->
  <path d="M158 350 L354 350 L330 466 Q326 486 306 486 L206 486 Q186 486 182 466 Z" fill="#3d472b"/>
  <rect x="146" y="336" width="220" height="34" rx="17" fill="#2d3520"/>
</svg>

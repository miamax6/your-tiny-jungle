/* ═══════════════════════════════════════════════════════════════
   TOKENS
   Courbes d'easing : emilkowalski/skills — emil-design-eng
   « The built-in CSS easings are too weak »
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --d-press: 140ms;
  --d-hover: 180ms;
  --d-enter: 240ms;
  --d-panel: 260ms;

  --font-head: 'Caprasimo', Georgia, serif;
  --font-body: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;

  /* Codes couleur du calendrier — identiques dans les deux thèmes */
  --c-int:   #e0864a;
  --c-ext:   #7fa05e;
  --c-plant: #5f93ad;
  --c-harv:  #d9ae3c;
}

/* ── Thème clair (défaut) ──────────────────────────────────── */
:root, [data-theme="light"]{
  --bg: #f5ead8;
  --bg-deep: #ebddc5;
  --surface: #fdf8ef;
  --surface-2: #f0e5d2;
  --surface-3: #e7dac4;
  --text: #201e1d;
  --text-dim: rgba(32,30,29,.66);
  --text-faint: rgba(32,30,29,.44);
  --divider: rgba(32,30,29,.14);
  --border: rgba(32,30,29,.10);
  --accent: #a5561f;
  --accent-soft: #ffe1d0;
  --accent-strong: #8c491a;
  --leaf: #5f7042;
  --leaf-soft: #e1eecc;
  --leaf-strong: #46542f;
  --hero-bg: #e1eecc;
  --hero-ink: #3d472b;
  --shadow-sm: 0 1px 2px rgba(80,60,30,.10);
  --shadow-md: 0 8px 24px -10px rgba(80,60,30,.22);
  --shadow-lg: 0 20px 48px -18px rgba(80,60,30,.30);
  --ring: rgba(165,86,31,.40);
  --glow-1: 14%;
  --glow-2: 11%;
  color-scheme: light;
}

/* ── Thème sombre — « jungle de nuit », pas « cave à charbon » ──
   Fonds remontés en luminosité et en chroma (vert forêt tiède au
   lieu du quasi-noir), surfaces plus détachées du fond, accents
   plus vifs. Les halos du fond sont aussi plus présents. */
/* Le fond précédent (#18210f) était un olive à 55 % de saturation en
   teinte 90° : sur une grande surface, ça vire au militaire. Ici la
   chroma tombe à ~20-25 % et la teinte passe en vert froid (~165°) ;
   c'est l'accent terracotta, resté chaud, qui porte la couleur. */
[data-theme="dark"]{
  --bg: #0f1413;
  --bg-deep: #0a0e0d;
  --surface: #171e1c;
  --surface-2: #202826;
  --surface-3: #2a3330;
  --text: #e9f1ec;
  --text-dim: rgba(233,241,236,.68);
  --text-faint: rgba(233,241,236,.45);
  --divider: rgba(233,241,236,.14);
  --border: rgba(233,241,236,.11);
  --accent: #f2a268;
  --accent-soft: #3a2518;
  --accent-strong: #ffc79c;
  --leaf: #9ec98a;
  --leaf-soft: #22301f;
  --leaf-strong: #c3e2b0;
  --hero-bg: #1a231f;
  --hero-ink: #e9f1ec;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 10px 28px -10px rgba(0,0,0,.6);
  --shadow-lg: 0 22px 54px -18px rgba(0,0,0,.7);
  --ring: rgba(242,162,104,.45);
  --glow-1: 14%;
  --glow-2: 10%;
  color-scheme: dark;
}

/* Les barres du calendrier gagnent en éclat sur fond sombre. */
[data-theme="dark"]{
  --c-int:   #f09155;
  --c-ext:   #97bd6c;
  --c-plant: #74aecb;
  --c-harv:  #eec44a;
}

/* ═══════════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* Le dégradé vit dans une couche `position:fixed` dédiée, pas dans
   `background-attachment:fixed` sur le body : sur mobile, cette
   propriété force un repeint à chaque frame de scroll et laisse
   apparaître des bandes coupées en bas pendant le défilement. */
/* Le sur-défilement élastique (iOS/Android) découvre le fond de
   <html> : on lui met la couleur du HAUT du dégradé, pas celle du
   bas, sinon on voit une bande sombre quand on tire vers le bas. */
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  color:var(--text);
  background:transparent;
  transition:color var(--d-panel) var(--ease-out);
}
body::before{
  content:"";
  position:fixed;top:0;left:0;right:0;z-index:-1;pointer-events:none;
  /* Au premier scroll, le navigateur mobile rétracte sa barre d'URL :
     le viewport grandit et une couche en `inset:0` se redimensionne
     en pleine frame, d'où la bande coupée en bas. `lvh` est la
     hauteur barre rétractée, donc la plus grande des deux : la
     couche ne bouge plus jamais. `vh` reste en repli. */
  height:100vh;
  height:100lvh;
  /* Couche de composition dédiée : le dégradé n'est plus repeint
     quand le bandeau collant et son backdrop-filter apparaissent. */
  transform:translateZ(0);
  backface-visibility:hidden;
  background:
    radial-gradient(1100px 620px at 82% -12%, color-mix(in srgb, var(--leaf) var(--glow-1), transparent), transparent 62%),
    radial-gradient(900px 540px at 4% 102%, color-mix(in srgb, var(--accent) var(--glow-2), transparent), transparent 60%),
    linear-gradient(178deg, var(--bg) 0%, var(--bg-deep) 100%);
  transition:background-color var(--d-panel) var(--ease-out);
}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:400;line-height:1.15;margin:0}
p{margin:0}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent);color:var(--bg-deep)}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ═══════════════════════════════════════════════════════════════
   BOUTONS — feedback de pression scale(0.97) (emil-design-eng)
   ═══════════════════════════════════════════════════════════════ */
.btn{
  font:inherit;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:38px;padding:0 15px;
  border-radius:var(--r-pill);
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  white-space:nowrap;
  transition:
    transform var(--d-press) var(--ease-out),
    background-color var(--d-hover) ease,
    border-color var(--d-hover) ease,
    color var(--d-hover) ease;
}
.btn:active{transform:scale(.97)}
.btn.is-on{
  background:var(--accent);
  border-color:transparent;
  color:var(--bg-deep);
}
[data-theme="light"] .btn.is-on{color:#fff}
.btn-icon{min-width:38px;padding:0 11px}

@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--surface-2);border-color:var(--divider)}
  .btn.is-on:hover{background:var(--accent-strong)}
}

.input{
  font:inherit;
  min-height:38px;
  padding:0 14px;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-pill);
  transition:border-color var(--d-hover) ease, box-shadow var(--d-hover) ease;
}
.input::placeholder{color:var(--text-faint)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
select.input{cursor:pointer;padding-right:10px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}

/* ═══════════════════════════════════════════════════════════════
   BANDEAU COMPACT COLLANT
   Apparaît une fois le grand bandeau passé. Motif : « preventing a
   jarring change » — le titre et la navigation ne disparaissent pas,
   ils se réduisent. Entrée en ease-out, sortie plus rapide que
   l'entrée (asymmetric enter/exit, emilkowalski/skills).
   ═══════════════════════════════════════════════════════════════ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:60;
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  transform:translateY(-100%);
  opacity:0;
  pointer-events:none;
  transition:transform 150ms var(--ease-out), opacity 120ms var(--ease-out);
}
.topbar.is-on{
  transform:none;opacity:1;pointer-events:auto;
  transition:transform 230ms var(--ease-out), opacity 180ms var(--ease-out);
}
.topbar-in{display:flex;align-items:center;gap:12px;height:56px;padding-inline:20px}
.topbar-mark{flex:none;width:26px;height:30px;display:block}
.topbar-mark svg{width:100%;height:100%;display:block;overflow:visible}
.topbar-title{
  font-family:'Jungledise', var(--font-head);
  font-size:25px;line-height:1;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar-tabs{display:flex;gap:4px;margin-left:auto;flex:none}
.minitab{
  font:inherit;font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;
  min-height:34px;padding:0 13px;
  border:1px solid var(--border);border-radius:var(--r-pill);
  background:var(--surface-2);color:var(--text-dim);cursor:pointer;
  white-space:nowrap;
  transition:transform var(--d-press) var(--ease-out), background-color var(--d-hover) ease, color var(--d-hover) ease, border-color var(--d-hover) ease;
}
.minitab:active{transform:scale(.97)}
.minitab.is-on{background:var(--accent);color:var(--bg-deep);border-color:transparent}
[data-theme="light"] .minitab.is-on{color:#fff}
@media (hover:hover) and (pointer:fine){ .minitab:not(.is-on):hover{color:var(--text);border-color:var(--divider)} }
.topbar-theme{flex:none;min-height:34px;min-width:34px;padding:0 9px;font-size:14px}
@media (max-width:640px){
  .topbar-in{height:52px;gap:9px;padding-inline:16px}
  .topbar-title{font-size:22px}
  .minitab{padding:0 11px}
  .minitab span{display:none}          /* emoji seul, on gagne la largeur */
  .minitab{gap:0;min-width:38px;justify-content:center;font-size:15px}
}

/* ── Retour en haut ──────────────────────────────────────────
   Entrée depuis scale(0.9) + opacity, jamais scale(0). */
.totop{
  position:fixed;right:18px;bottom:18px;z-index:55;
  width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;line-height:1;
  border:1px solid var(--border);border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--text-dim);
  box-shadow:var(--shadow-md);
  cursor:pointer;
  opacity:0;transform:translateY(8px) scale(.9);pointer-events:none;
  transition:opacity 140ms var(--ease-out), transform 140ms var(--ease-out), color var(--d-hover) ease, border-color var(--d-hover) ease;
}
.totop.is-on{
  opacity:1;transform:none;pointer-events:auto;
  transition:opacity 200ms var(--ease-out), transform 200ms var(--ease-out), color var(--d-hover) ease, border-color var(--d-hover) ease;
}
.totop:active{transform:scale(.95)}
@media (hover:hover) and (pointer:fine){
  .totop:hover{color:var(--accent);border-color:var(--accent)}
}
@media (max-width:640px){ .totop{right:14px;bottom:14px;width:44px;height:44px} }

/* ═══════════════════════════════════════════════════════════════
   HERO
   Les collines s'étirent (forme abstraite, l'étirement ne choque
   pas). Le soleil et la plante sont à taille FIXE, positionnés :
   ils gardent leurs proportions quelle que soit la largeur.
   ═══════════════════════════════════════════════════════════════ */
.hero{
  position:relative;overflow:hidden;
  margin:22px 0 20px;
  border-radius:var(--r-lg);
  background:var(--hero-bg);
  box-shadow:var(--shadow-md);
  min-height:316px;
  padding:34px 40px 38px;
  cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;
  transition:box-shadow var(--d-hover) ease, background-color var(--d-panel) var(--ease-out);
}
@media (hover:hover) and (pointer:fine){ .hero:hover{box-shadow:var(--shadow-lg)} }
.hero-copy{position:relative;z-index:3;max-width:min(100%, 620px)}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--hero-ink);
  padding:5px 12px;border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--hero-ink) 14%, transparent);
  margin-bottom:14px;
}
.hero-title{
  font-family:'Jungledise', var(--font-head);
  font-size:clamp(44px,6.2vw,92px);
  line-height:1;
  color:var(--hero-ink);
  margin:0 0 12px;
  white-space:nowrap;
}
.hero-sub{font-size:15px;max-width:40ch;color:var(--hero-ink);opacity:.78}
.hero-hills{position:absolute;left:0;right:0;bottom:0;height:58%;z-index:0;pointer-events:none}
.hero-hills svg{width:100%;height:100%;display:block}
.hero-sun{
  position:absolute;right:19%;top:26px;
  width:92px;height:92px;border-radius:50%;
  background:#f0c9a0;z-index:0;pointer-events:none;
}
.hero-plant{position:absolute;right:6%;bottom:0;height:246px;z-index:2;pointer-events:none}
.hero-plant svg{height:100%;width:auto;display:block}
@media (max-width:860px){
  .hero-sun{right:16%;width:72px;height:72px}
  .hero-plant{height:180px;right:4%}
  .hero-sub{max-width:26ch}
}
@media (max-width:620px){
  .hero{padding:20px 20px 132px;min-height:0}
  .hero-eyebrow{display:none}
  .hero-copy{max-width:100%}
  .hero-title{white-space:normal;font-size:clamp(38px,12vw,60px)}
  .hero-sub{max-width:100%}
  .hero-sun{top:auto;bottom:92px;right:9%;width:58px;height:58px}
  .hero-plant{height:142px;right:7%}
  .hero-hills{height:126px}
}

/* ═══════════════════════════════════════════════════════════════
   ONGLETS — technique clip-path d'emilkowalski :
   deux pistes superposées, la copie « active » est clippée sur
   l'onglet courant. La couleur du texte bascule sans crossfade.
   ═══════════════════════════════════════════════════════════════ */
.tabs{
  position:relative;
  display:inline-block;
  padding:4px;
  border-radius:var(--r-pill);
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  margin-bottom:22px;
}
.tabs-track{display:flex;gap:2px}
.tab{
  font:inherit;font-weight:600;font-size:14.5px;
  display:inline-flex;align-items:center;gap:7px;
  min-height:38px;padding:0 20px;
  border:0;border-radius:var(--r-pill);
  background:transparent;color:var(--text-dim);
  cursor:pointer;white-space:nowrap;
  transition:color var(--d-hover) ease, transform var(--d-press) var(--ease-out);
}
.tab:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){ .tab:hover{color:var(--text)} }
.tabs-overlay{
  position:absolute;inset:4px;
  display:flex;gap:2px;
  pointer-events:none;
  clip-path:inset(0 100% 0 0 round var(--r-pill));
  transition:clip-path var(--d-panel) var(--ease-out);
}
.tabs-overlay .tab{
  background:var(--accent);
  color:var(--bg-deep);
  transform:none;
}
[data-theme="light"] .tabs-overlay .tab{color:#fff}

.view{display:none}
.view.is-active{display:block}

/* ═══════════════════════════════════════════════════════════════
   CARTES
   ═══════════════════════════════════════════════════════════════ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);
  transition:
    transform var(--d-hover) var(--ease-out),
    box-shadow var(--d-hover) var(--ease-out),
    border-color var(--d-hover) ease;
}
@media (hover:hover) and (pointer:fine){
  .card-lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb, var(--leaf) 50%, transparent)}
}
/* Au doigt il n'y a pas de survol : la carte paraît morte. On rend
   la pression : « Feedback », fréquence élevée donc mouvement
   quasi imperceptible (0.985) et court (140 ms). Neutralisé sur les
   zones de saisie, sinon cocher une case fait sauter toute la carte. */
@media (hover:none) and (pointer:coarse){
  .card-lift:active{
    transform:scale(.985);
    border-color:color-mix(in srgb, var(--leaf) 55%, transparent);
  }
  .card-lift:has(:focus-visible):active,
  .card-lift:has(.note-input:focus):active{transform:none}
}

.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:600;
  padding:3px 10px;border-radius:var(--r-pill);
  background:var(--surface-2);color:var(--text-dim);
  border:1px solid var(--border);
}
.tag-accent{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent}
.tag-leaf{background:var(--leaf-soft);color:var(--leaf-strong);border-color:transparent}

/* ── Grille de cartes + apparition échelonnée ──────────────────
   Stagger 34ms, plafonné (voir JS) — « Keep stagger delays short
   (30-80ms) » / « never block interaction ». */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
.stagger{
  opacity:0;
  transform:translateY(10px) scale(.985);
  animation:pop var(--d-enter) var(--ease-out) forwards;
  animation-delay:var(--stagger,0ms);
}
@keyframes pop{to{opacity:1;transform:none}}

/* ── Fiche plante ─────────────────────────────────────────── */
.plant{padding:19px 21px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 14px;align-items:start;scroll-margin-top:24px}
.plant>*{grid-column:1;min-width:0}
.plant-name{font-family:var(--font-head);font-size:19px;line-height:1.2}
.plant-latin{font-style:italic;font-size:12.5px;color:var(--accent)}
.plant-latin:hover{text-decoration:underline;text-underline-offset:2px}
.plant-rooms{display:flex;flex-direction:column;gap:5px;grid-column:2;grid-row:1/span 4;align-self:start}
.chip{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;font-size:15px;line-height:1;
  border-radius:var(--r-pill);
  background:var(--leaf-soft);
  transition:transform var(--d-press) var(--ease-out);
}
@media (hover:hover) and (pointer:fine){ .chip:hover{transform:scale(1.09)} }
.plant-meta{grid-column:1;display:flex;flex-direction:column;gap:3px}
.label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.plant-where{font-size:13px;font-weight:600;color:var(--accent)}
.plant-tags{grid-column:1;display:flex;flex-wrap:wrap;gap:6px}
.plant-notes{grid-column:1/-1 !important;margin-top:2px;padding-top:11px;border-top:1px solid var(--divider);font-size:13px;color:var(--text-dim)}
.photo-link{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--leaf-strong)}

/* ── Repliable ────────────────────────────────────────────── */
.fold{overflow:hidden;padding:0;margin-bottom:20px}
.fold-head{
  width:100%;font:inherit;font-family:var(--font-head);font-size:17px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 22px;text-align:left;
  background:none;border:0;color:var(--text);cursor:pointer;
  transition:background-color var(--d-hover) ease, transform var(--d-press) var(--ease-out);
}
.fold-head:active{transform:scale(.995)}
@media (hover:hover) and (pointer:fine){ .fold-head:hover{background:var(--surface-2)} }
.fold-arrow{
  font-size:12px;color:var(--accent);
  transition:transform var(--d-panel) var(--ease-out);
}
.fold[open-state="1"] .fold-arrow{transform:rotate(180deg)}
.fold-body{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows var(--d-panel) var(--ease-out);
}
.fold[open-state="1"] .fold-body{grid-template-rows:1fr}
.fold-body>div{overflow:hidden}
.fold-inner{padding:0 22px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:9px 28px}
.fold-inner li{list-style:none;font-size:13.5px;display:flex;gap:9px}
.fold-inner ul{margin:0;padding:0;display:contents}

/* ═══════════════════════════════════════════════════════════════
   GRAINES
   ═══════════════════════════════════════════════════════════════ */
.now{
  padding:22px 24px;margin-bottom:20px;
  background:linear-gradient(135deg, var(--leaf-soft), var(--surface));
  border:1px solid color-mix(in srgb, var(--leaf) 34%, transparent);
}
.now h3{font-size:19px;margin-bottom:3px}
.now-sub{font-size:13px;color:var(--text-dim);margin-bottom:14px}
.now-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px}
.now-group .label{margin-bottom:6px;display:block}
.now-list{display:flex;flex-wrap:wrap;gap:6px}
.seed-pill{
  font:inherit;font-size:12.5px;font-weight:600;
  padding:5px 12px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  cursor:pointer;
  transition:transform var(--d-press) var(--ease-out), background-color var(--d-hover) ease, border-color var(--d-hover) ease;
}
.seed-pill:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){ .seed-pill:hover{background:var(--surface-2);border-color:var(--accent)} }
.now-empty{font-size:14px;color:var(--text-dim);font-style:italic}

/* ── Légende du calendrier ────────────────────────────────── */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 12px;font-size:12.5px;color:var(--text-dim)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:6px;vertical-align:-2px}

/* ── Calendrier ───────────────────────────────────────────
   Grille CSS, pas un tableau : sous 700 px la ligne se replie —
   le nom de la graine passe sur sa propre ligne pleine largeur et
   les 12 mois occupent toute la largeur en dessous. Plus de colonne
   figée qui mange l'écran, plus de scroll horizontal du tout. */
/* Pas d'overflow:hidden ici : il neutraliserait le position:sticky
   de l'en-tête des mois. Les coins arrondis sont donc portés par
   l'en-tête et par la dernière ligne. */
.cal-wrap{
  border-radius:var(--r-md);border:1px solid var(--border);
  background:var(--surface);box-shadow:var(--shadow-sm);
  margin-bottom:26px;
}
.cal{font-size:12.5px}
.cal-head,.cal-row{
  display:grid;
  grid-template-columns:210px repeat(12, minmax(0,1fr));
  align-items:stretch;
}
.cal-head{
  position:sticky;top:0;z-index:2;
  background:var(--surface-2);
  border-bottom:1px solid var(--divider);
  border-radius:calc(var(--r-md) - 1px) calc(var(--r-md) - 1px) 0 0;
}
.cal-row:last-of-type{border-radius:0 0 calc(var(--r-md) - 1px) calc(var(--r-md) - 1px)}
.cal-row:last-of-type>*:first-child{border-bottom-left-radius:inherit}
/* Le bandeau collant fait 56 px : l'en-tête des mois se cale juste
   dessous au lieu de passer derrière. */
.topbar-armed .cal-head{top:56px}
.cal-m{
  padding:10px 2px 9px;text-align:center;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-dim);
}
.cal-m.is-now{color:var(--accent);background:var(--accent-soft)}
.cal-m .m-short{display:none}
.cal-row{border-top:1px solid var(--divider)}
.cal-row:first-of-type{border-top:0}
.cal-name{
  padding:9px 14px;min-width:0;
  border-right:1px solid var(--divider);
  display:flex;flex-direction:column;justify-content:center;
}
.cal-seed{font-weight:600;font-size:13px;line-height:1.25}
.cal-lat{font-style:italic;font-size:11px;color:var(--text-faint)}
.cal-cell{
  display:flex;flex-direction:column;gap:2px;justify-content:center;
  padding:6px 3px;min-height:38px;
}
.cal-cell.is-now-col{background:color-mix(in srgb, var(--accent) 7%, transparent)}
.bar{height:7px;border-radius:3px}
.bar-int{background:var(--c-int)}
.bar-ext{background:var(--c-ext)}
.bar-plant{background:var(--c-plant)}
.bar-harv{background:var(--c-harv)}

@media (max-width:700px){
  .cal-head,.cal-row{grid-template-columns:repeat(12, minmax(0,1fr))}
  .topbar-armed .cal-head{top:52px}
  .cal-corner{display:none}
  .cal-m{padding:8px 0;font-size:10px;letter-spacing:0}
  .cal-m .m-long{display:none}
  .cal-m .m-short{display:inline}
  .cal-name{
    grid-column:1 / -1;
    border-right:0;
    border-bottom:1px solid var(--divider);
    padding:9px 14px 7px;
    background:color-mix(in srgb, var(--surface-2) 60%, transparent);
  }
  .cal-row{padding-bottom:4px}
  .cal-cell{padding:5px 2px;min-height:30px}
  .bar{height:6px}
}

/* ── Fiche graine ─────────────────────────────────────────── */
.seed{padding:18px 20px;display:flex;flex-direction:column;gap:11px;scroll-margin-top:24px}
.is-hit{animation:hit 1400ms var(--ease-out)}
@keyframes hit{0%{box-shadow:0 0 0 0 var(--accent)}28%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.seed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.seed-name{font-family:var(--font-head);font-size:17.5px;line-height:1.2}
.seed-lat{font-style:italic;font-size:12px;color:var(--accent)}
.seed-lat:hover{text-decoration:underline;text-underline-offset:2px}
.seed-rows{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.seed-row{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:baseline}
.seed-row dt{color:var(--text-faint);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.seed-row dd{margin:0;color:var(--text-dim)}
.seed-note{font-size:12.5px;color:var(--text-dim);padding-top:10px;border-top:1px solid var(--divider)}

/* Bascule « semé » : la coche entre en scale(0.95)+opacity,
   jamais scale(0) — emilkowalski/skills. */
.sown{
  display:inline-flex;align-items:center;gap:9px;
  font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;
  color:var(--text-dim);
  transition:color var(--d-hover) ease;
}
.sown input{position:absolute;opacity:0;width:0;height:0}
.box{
  position:relative;flex:none;
  width:21px;height:21px;border-radius:7px;
  border:1.5px solid var(--divider);
  background:var(--surface-2);
  transition:background-color var(--d-hover) var(--ease-out), border-color var(--d-hover) var(--ease-out), transform var(--d-press) var(--ease-out);
}
.sown:active .box{transform:scale(.92)}
.box::after{
  content:"";position:absolute;left:6.5px;top:3px;
  width:5px;height:10px;
  border:solid var(--bg-deep);border-width:0 2.2px 2.2px 0;
  transform:rotate(45deg) scale(.6);
  opacity:0;
  transition:opacity var(--d-press) var(--ease-out), transform var(--d-press) var(--ease-out);
}
.sown input:checked+.box{background:var(--leaf);border-color:transparent}
.sown input:checked+.box::after{opacity:1;transform:rotate(45deg) scale(1)}
.sown:has(input:checked){color:var(--leaf-strong)}
.seed.is-sown{border-color:color-mix(in srgb, var(--leaf) 45%, transparent)}
.note-input{
  font:inherit;font-size:12.5px;width:100%;
  min-height:34px;padding:6px 12px;
  border-radius:var(--r-sm);
  border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);
  resize:vertical;
  transition:border-color var(--d-hover) ease, box-shadow var(--d-hover) ease;
}
.note-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}

.bar-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.io-sep{width:1px;height:24px;background:var(--divider);margin:0 2px}
.io-zone{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding:14px 18px;margin-bottom:12px;
  border-radius:var(--r-md);
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  font-size:13.5px;
}
/* Entrée : opacité + léger décalage, jamais depuis scale(0). */
.io-zone:not([hidden]){animation:ioIn var(--d-enter) var(--ease-out)}
@keyframes ioIn{from{opacity:0;transform:translateY(-6px) scale(.99)}}
.io-zone strong{color:var(--accent-strong)}
.io-zone .io-actions{display:flex;gap:8px;margin-left:auto}
.io-status{font-size:12.5px;color:var(--text-dim);margin:0 0 12px;min-height:1.2em}
.io-status.is-err{color:var(--accent-strong)}
@media (max-width:560px){ .io-sep{display:none} .io-zone .io-actions{margin-left:0;width:100%} }

.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.count{font-size:12.5px;color:var(--text-faint);margin:0 0 16px}

.group-card{padding:24px 26px}
.group-card h3{font-size:18px;margin-bottom:10px}
.group-block+.group-block{margin-top:14px}
.group-block h5{margin:0 0 4px;font-family:var(--font-body);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;color:var(--accent)}
.group-block p{font-size:13.5px;color:var(--text-dim)}
.jump{color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;cursor:pointer;transition:color var(--d-hover) ease}
@media (hover:hover) and (pointer:fine){ .jump:hover{color:var(--accent)} }

footer{padding:44px 0 40px;font-size:12px;color:var(--text-faint);text-align:center}
footer a{color:var(--text-dim);text-decoration:underline;text-underline-offset:2px}

/* ═══════════════════════════════════════════════════════════════
   ASSISTANT DE CONFIGURATION
   Modale : transform-origin au centre — c'est l'exception à la
   règle « origine au déclencheur », elle n'est ancrée nulle part.
   Entrée depuis scale(0.96), jamais scale(0).
   ═══════════════════════════════════════════════════════════════ */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
/* `display:flex` écrase l'attribut hidden : sans cette règle, la
   modale invisible intercepte tous les clics de la page. */
.modal[hidden]{display:none}
[hidden]{display:none !important}
.modal-back{
  position:absolute;inset:0;
  background:color-mix(in srgb, var(--bg-deep) 72%, transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transition:opacity 200ms var(--ease-out);
}
.modal-box{
  position:relative;z-index:1;
  width:min(720px, 100%);max-height:min(86vh, 860px);
  display:flex;flex-direction:column;
  background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);
  opacity:0;transform:scale(.96) translateY(8px);
  transition:opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
}
.modal.is-on .modal-back{opacity:1}
.modal.is-on .modal-box{opacity:1;transform:none}
/* Sortie plus rapide que l'entrée. */
.modal.is-off .modal-back{opacity:0;transition-duration:140ms}
.modal.is-off .modal-box{opacity:0;transform:scale(.97);transition-duration:140ms}

.modal-head{display:flex;align-items:center;gap:12px;padding:20px 22px 14px}
.modal-head h2{font-size:21px;flex:1}
.modal-body{overflow-y:auto;padding:0 22px 6px;flex:1}
.modal-foot{display:flex;flex-direction:column;gap:11px;padding:14px 22px 18px;border-top:1px solid var(--divider);margin-top:8px}
.foot-hint{font-size:12px;line-height:1.5;color:var(--text-dim);margin:0}
.foot-hint strong{color:var(--text)}
.foot-hint code{font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.foot-hint #setupCount{display:block;margin-top:3px;color:var(--text-faint)}
.foot-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
/* `flex:1` sur des libellés longs les comprimait jusqu'au
   chevauchement : sous 620 px on empile, chacun sur sa ligne. */
@media (max-width:620px){
  .foot-btns{flex-direction:column-reverse;align-items:stretch}
  .foot-btns .btn{width:100%}
}
.ds-flag.is-tip{background:var(--leaf-soft);border-color:color-mix(in srgb, var(--leaf) 45%, transparent)}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* 4 étapes : sans wrap, la dernière sortait de l'écran sous 360 px
   et devenait inatteignable. */
.steps{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px 14px}
@media (max-width:420px){
  .steps{padding:0 16px 12px;gap:5px}
  .step{padding:0 10px;font-size:12px;min-height:32px}
  .step b{width:17px;height:17px;font-size:10px}
}
.step{
  font:inherit;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;
  min-height:34px;padding:0 13px;
  border:1px solid var(--border);border-radius:var(--r-pill);
  background:var(--surface-2);color:var(--text-dim);cursor:pointer;
  transition:transform var(--d-press) var(--ease-out), background-color var(--d-hover) ease, color var(--d-hover) ease;
}
.step:active{transform:scale(.97)}
.step b{
  display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:var(--r-pill);
  background:var(--divider);font-size:11px;font-weight:700;
}
.step.is-on{background:var(--accent);color:var(--bg-deep);border-color:transparent}
.step.is-on b{background:color-mix(in srgb, var(--bg-deep) 22%, transparent)}
[data-theme="light"] .step.is-on{color:#fff}
/* Le retour vers la fourche : pas un numéro, pas un rang dans la
   suite — une flèche, visuellement en retrait des quatre étapes. */
.step-back{min-width:34px;padding:0;justify-content:center;font-weight:700;color:var(--text-faint)}

/* ── Fourche d'entrée ────────────────────────────────────────
   Écran vu une seule fois : c'est là que le budget d'animation
   a le droit d'être dépensé (étagement 60 ms). */
.routes{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.route{
  font:inherit;text-align:left;cursor:pointer;
  display:flex;align-items:flex-start;gap:13px;
  padding:14px 15px;
  border:1px solid var(--border);border-radius:var(--r-card);
  background:var(--surface-2);color:var(--text);
  transition:transform var(--d-press) var(--ease-out),
             background-color var(--d-hover) ease,
             border-color var(--d-hover) ease;
}
.route:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){
  .route:hover{background:var(--surface-3, var(--surface));border-color:var(--accent)}
}
.route-emo{font-size:23px;line-height:1.1;flex:none}
.route-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.route-txt strong{font-size:14.5px;font-weight:700}
.route-txt em{font-style:normal;font-size:12.5px;color:var(--text-dim);line-height:1.45}
.pane[data-pane="0"].is-on .route{animation:routeIn 260ms var(--ease-out) backwards}
.pane[data-pane="0"].is-on .route:nth-child(1){animation-delay:40ms}
.pane[data-pane="0"].is-on .route:nth-child(2){animation-delay:100ms}
.pane[data-pane="0"].is-on .route:nth-child(3){animation-delay:160ms}
@keyframes routeIn{from{opacity:0;transform:translateY(8px) scale(.98)}}
@media (prefers-reduced-motion:reduce){
  .pane[data-pane="0"].is-on .route{animation-duration:1ms;animation-delay:0ms}
}

.pane{display:none}
.pane.is-on{display:block;animation:paneIn 220ms var(--ease-out)}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}}

.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld>span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.hint{font-size:12.5px;color:var(--text-dim);line-height:1.5}
.hint code{font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.warn{font-size:12.5px;color:var(--accent-strong);background:var(--accent-soft);padding:9px 13px;border-radius:var(--r-sm);margin-top:10px}

.room-row{
  display:grid;grid-template-columns:52px 1.1fr 1fr 38px;gap:7px;align-items:start;
  margin:9px 0;
}
.room-row .r-det{grid-column:1 / -1;margin-top:-2px}
.room-row .input{min-height:36px;font-size:13.5px;width:100%;border-radius:var(--r-sm)}
.room-row .r-emo{text-align:center;padding:0 4px;font-size:17px}
.room-row .btn{min-height:36px;min-width:36px;padding:0;border-radius:var(--r-sm)}
.room-row.is-going{opacity:0;transform:scale(.97);transition:opacity 140ms var(--ease-out), transform 140ms var(--ease-out)}
.room-row.is-new{animation:paneIn 240ms var(--ease-out)}
@media (max-width:620px){
  .room-row{grid-template-columns:50px 1fr 38px}
  .room-row .r-ori{grid-column:1 / 3}
  .modal{padding:0}
  .modal-box{max-height:100vh;height:100%;width:100%;border-radius:0;border:0}
}

.prompt-box{
  font:12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  width:100%;padding:13px 15px;margin-top:10px;
  border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--text);resize:vertical;
}
.prompt-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}

.ds-flag.is-demo{
  background:var(--accent-soft);
  border-color:color-mix(in srgb, var(--accent) 45%, transparent);
}
.ds-flag.is-demo strong{color:var(--accent-strong)}
.ds-flag{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:14px;padding:10px 15px;
  font-size:12.5px;
  border-radius:var(--r-pill);
  background:var(--leaf-soft);
  border:1px solid color-mix(in srgb, var(--leaf) 40%, transparent);
}
.ds-flag button{font:inherit;font-size:12.5px;font-weight:600;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0}

/* ── Synchronisation ─────────────────────────────────────── */
.sync-pill{
  flex:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;
  padding:5px 11px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);
  white-space:nowrap;
  transition:background-color var(--d-hover) ease, color var(--d-hover) ease, border-color var(--d-hover) ease;
}
.sync-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.sync-pill.is-ok{color:var(--leaf-strong);background:var(--leaf-soft);border-color:transparent}
.sync-pill.is-dirty,.sync-pill.is-busy{color:var(--accent-strong);background:var(--accent-soft);border-color:transparent}
.sync-pill.is-busy::before{animation:pulse 1.1s ease-in-out infinite}
.sync-pill:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .sync-pill:hover{border-color:var(--accent)} }
#conflictBar:not([hidden]){margin-top:14px}
@keyframes pulse{50%{opacity:.25}}
.sync-pill.is-conflict,.sync-pill.is-error{color:#fff;background:#b3421f;border-color:transparent}
[data-theme="dark"] .sync-pill.is-conflict,[data-theme="dark"] .sync-pill.is-error{background:#d25830}
/* Sur mobile, la pastille de la barre collante mangeait la place du
   titre : elle disparaît, l'état reste lisible en haut de page. */
@media (max-width:560px){ .topbar .sync-pill{display:none} }
.top-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;padding-top:14px}
.top-row-btns{display:flex;gap:8px;margin-left:auto}
#syncLine{font-size:12px;white-space:normal;text-align:left}
.foot-alt summary{font-size:12px;color:var(--text-faint);cursor:pointer;padding:2px 0}
.foot-alt[open] summary{margin-bottom:6px}
.foot-alt .foot-hint{margin-bottom:8px}
.linkbtn{font:inherit;font-size:inherit;font-weight:600;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0}

.guide{margin:0 0 16px;padding-left:20px;font-size:12.5px;color:var(--text-dim);line-height:1.6}
.guide li{margin-bottom:7px}
.guide strong{color:var(--text)}
.sy-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){ .sy-grid{grid-template-columns:1fr} }

/* ── QR de partage ───────────────────────────────────────────
   Fond blanc et modules noirs imposés : un QR qui suit le thème
   sombre n'est pas lu par beaucoup de téléphones. */
.qr-wrap{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:var(--r-md);margin:4px 0 12px}
#qrBox{width:min(260px,70vw);line-height:0}
#qrBox svg{width:100%;height:auto;display:block;shape-rendering:crispEdges}
/* Le fond ET les modules sont des éléments SVG : les peindre
   tous les deux en noir donne un carré noir illisible. */
#qrBox svg rect{fill:#fff}
#qrBox svg path{fill:#000}
.qr-code-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:var(--r-sm);background:var(--surface-2)}
.qr-code-row strong{font-family:ui-monospace,SFMono-Regular,monospace;font-size:19px;letter-spacing:.14em;color:var(--accent-strong)}

/* ═══════════════════════════════════════════════════════════════
   MOUVEMENT RÉDUIT — on garde l'opacité et la couleur, on retire
   le déplacement. « Reduced motion means fewer and gentler
   animations, not zero. »
   ═══════════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-delay:0ms !important;
    transition-duration:120ms !important;
  }
  .stagger{opacity:1;transform:none;animation:none}
  .card-lift:hover{transform:none}
  .chip:hover{transform:none}
  .btn:active,.tab:active,.seed-pill:active,.sown:active .box,.minitab:active,.totop:active,.card-lift:active,.step:active{transform:none}
  .modal-box{transform:none !important}
  .pane.is-on{animation:none}
  .topbar{transition:opacity 120ms ease}
  .topbar:not(.is-on){transform:none}
}
</style>
